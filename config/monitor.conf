# =============================================================================
# monitor.conf — Server Performance Monitor Configuration
# =============================================================================
# This file is sourced by server_monitor.sh if present at:
#   ./config/monitor.conf  OR  /etc/server-monitor/monitor.conf
#
# CLI flags always override values set here.
# =============================================================================

# ---------------------------------------------------------------------------
# COLLECTION SETTINGS
# ---------------------------------------------------------------------------

# Refresh interval in seconds (used with --watch mode)
INTERVAL=5

# Number of top processes to display for CPU and memory
TOP_COUNT=5

# ---------------------------------------------------------------------------
# OUTPUT SETTINGS
# ---------------------------------------------------------------------------

# Set to 'true' to emit one JSON object per line instead of pretty output
JSON_MODE=false

# Path to append log output (leave empty to disable file logging)
# OUTPUT_FILE="/var/log/server_perf.json"
OUTPUT_FILE=""

# ---------------------------------------------------------------------------
# ALERT THRESHOLDS (percentage)
# ---------------------------------------------------------------------------

# Emit [WARN] when CPU usage exceeds this value
CPU_ALERT_THRESHOLD=85

# Emit [WARN] when memory usage exceeds this value
MEM_ALERT_THRESHOLD=85

# Emit [WARN] when any disk mount point usage exceeds this value
DISK_ALERT_THRESHOLD=90
